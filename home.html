      <h1>ALOJANA</h1>
      <p>Encontra el mejor hospedaje para tu mascota</p>

      <!-- busqueda por filtro de lugar y fecha-->
      <form class="row justify-content-center g-2 my-4" onsubmit="buscar(event)">
        <div class="col-md-4">
          <input type="text" id="region" class="form-control" placeholder="País o región" required>
        </div>
        <div class="col-md-3">
          <input type="date" id="fecha" class="form-control" required>
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-primary w-100">Buscar</button>
        </div>
      </form>
