      content="hospedaje de mascotas, cuidado de animales, perros, gatos, cuidadores, anfitriones, pet sitting"

    <meta name="robots" content="index, follow" />
    <link
      rel="canonical"
      href="https://camiromero99.github.io/Alojana/home.html"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>


<body>

<!-- Nav con bootstrap, se replica para todas las paginas-->
  <header>
    
    <nav class="navbar navbar-expand-lg bg-danger bg-primary sticky-top shadow">
      <div class="container">
        <a class="navbar-brand" href="home.html">ALOJANA</a>

          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>

        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav">

<main>
  <div class="portada">
    <div class="contenido text-center">
      <h1>ALOJANA</h1>
      <p>Encontra el mejor hospedaje para tu mascota</p>

      <!-- busqueda por filtro de lugar y fecha-->
      <form class="row justify-content-center g-2 my-4" onsubmit="buscar(event)">
        <div class="col-md-4">
          <input type="text" id="region" class="form-control" placeholder="País o región" required>
        </div>
        <div class="col-md-3">
          <input type="date" id="fecha" class="form-control" required>
        </div>
        <div class="col-md-2">
        <button type="submit" class="btn btn-danger w-100">Buscar</button>

        </div>
      </form>

    
      <!-- <a href="hospedaje.html">
        <button type="submit" class="btn btn-danger px-4">VER HOSPEDAJES</button>
      </a> -->

    </div>
  </div>
</main>

  <!--Hospedajes destacados-->
  <h2 class="text-center my-5">Hospedajes destacados</h2>


    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
    
      <div class="col">
        <div class="card h-100 shadow-sm">
          <img src="img/foto.png" class="card-img-top" alt="Hospedaje 1">
          <div class="card-body text-center">
            <h5 class="card-title">Camila</h5>
            <button type="submit" class="btn btn-danger px-4">VER MAS</button>
          </div>
        </div>
      </div>

     
      <div class="col">
        <div class="card h-100 shadow-sm">
          <img src="img/foto.png" class="card-img-top" alt="Hospedaje 2">
          <div class="card-body text-center">
            <h5 class="card-title">Martina</h5>
            <button type="submit" class="btn btn-danger px-4">VER MAS</button>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card h-100 shadow-sm">
          <img src="img/foto.png" class="card-img-top" alt="Hospedaje 3">
          <div class="card-body text-center">
            <h5 class="card-title">Lola</h5>
            <button type="submit" class="btn btn-danger px-4">VER MAS</button>
          </div>
        </div>
      </div>
    </div>
  </main>

<!-- Carrusel de fotos -->
<section class="container my-5">
  

  <div id="carruselFotos" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carruselFotos" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#carruselFotos" data-bs-slide-to="1" aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#carruselFotos" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>

    <div class="carousel-inner rounded-4 shadow">
      <div class="carousel-item active">
        <img src="img/portada.jpg" class="d-block w-100" alt="Foto 1" style="height: 400px; object-fit: cover;">
      </div>
      <div class="carousel-item">
        <img src="img/portadaAnfitrion.jpg" class="d-block w-100" alt="Foto 2" style="height: 400px; object-fit: cover;">
      </div>
      <div class="carousel-item">
        <img src="img/portada.jpg" class="d-block w-100" alt="Foto 3" style="height: 400px; object-fit: cover;">
      </div>
    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#carruselFotos" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Anterior</span>
    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#carruselFotos" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Siguiente</span>
    </button>
  </div>
</section>
