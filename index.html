<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ALOJANA es una plataforma para encontrar o brindar hospedaje a mascotas. Conectá con cuidadores responsables y amorosos."
    />
    <meta
      name="keywords"
      content="hospedaje de mascotas, cuidado de animales, perros, gatos, cuidadores, anfitriones, pet sitting"
    />
    <meta name="author" content="Camila Romero" />
    <meta name="robots" content="index, follow" />
    <link
      rel="canonical"
      href="https://camiromero99.github.io/Alojana/home.html"
    />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <title>ALOJANA - Hospedaje de Mascotas</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body
    class="bg-light d-flex align-items-center justify-content-center min-vh-100"
  >
    <main class="contenedor-login">
      <div class="card">
        <h1>ALOJANA</h1>

        <div class="mb-3">
          <label for="usuario">Usuario</label>
          <input type="text" name="usuario" id="usuario" class="form-control" />
        </div>
        <div class="mb-3">
          <label for="password">Password</label>
          <input
            type="password"
            name="password"
            id="password"
            class="form-control"
          />
        </div>
        <a href="home.html">
          <button type="submit" class="btn btn-primary w-100">INGRESAR</button>
        </a>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
